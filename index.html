<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #C59B27;
      --gold-dark: #9E7A1B;
      --soft-white: rgba(255, 255, 255, 0.96);
      --text-dark: #2C221E;
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
    }

    body {
      background: linear-gradient(rgba(20, 15, 12, 0.45), rgba(20, 15, 12, 0.45)), 
                  url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 1.5rem 1.5rem 1.5rem;
      overflow: hidden;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 1rem;
      padding: 1rem 2rem 1.2rem 2rem;
      background: var(--soft-white);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 2px solid var(--gold);
      width: 100%;
      max-width: 1100px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold-dark);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: var(--text-dark);
      font-weight: 400;
      line-height: 1.1;
    }

    header h1 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.8rem;
      color: var(--gold-dark);
      margin: 0 0.5rem;
    }

    /* Top Navigation Menu */
    nav.main-nav {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      background: rgba(245, 237, 220, 0.85);
      padding: 0.5rem;
      border-radius: 30px;
      border: 1px solid var(--gold);
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #FFFFFF;
      border: 2px solid var(--gold);
      color: var(--text-dark);
      padding: 0.55rem 1.3rem;
      border-radius: 25px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .nav-btn:hover {
      background: #FAF0D7;
      border-color: var(--gold-dark);
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: var(--gold);
      color: #FFFFFF;
      border-color: var(--gold-dark);
      box-shadow: 0 4px 12px rgba(197, 155, 39, 0.4);
    }

    /* Main Full-Height Container */
    main {
      width: 100%;
      max-width: 1300px;
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      width: 100%;
      height: 100%;
      display: none;
    }

    .tab-content.active {
      display: flex;
    }

    /* Full Height & Width iFrame Wrapper with Scrollability */
    .iframe-wrapper {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 18px;
      overflow: auto; /* Enables scrolling inside smaller windows/frames */
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow);
      border: 2px solid rgba(197, 155, 39, 0.5);
      position: relative;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      display: block;
    }

    /* Photo Gallery Styling */
    .photo-gallery-card {
      width: 100%;
      height: 100%;
      background: var(--soft-white);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 1.5rem 1.8rem;
      box-shadow: var(--shadow);
      border: 2px solid rgba(197, 155, 39, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px dashed var(--gold);
      flex-shrink: 0;
    }

    .gallery-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--text-dark);
      letter-spacing: 0.5px;
    }

    .gallery-header .photo-count {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold-dark);
      background: #FAF0D7;
      padding: 0.3rem 0.8rem;
      border-radius: 15px;
      border: 1px solid var(--gold);
    }

    .gallery-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .gallery-scroll-area::-webkit-scrollbar,
    .iframe-wrapper::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .gallery-scroll-area::-webkit-scrollbar-track,
    .iframe-wrapper::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }
    .gallery-scroll-area::-webkit-scrollbar-thumb,
    .iframe-wrapper::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.3rem;
      padding-bottom: 1rem;
    }

    .image-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      cursor: pointer;
      border: 2px solid transparent;
      background: #EAE2D6;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .image-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--gold);
      box-shadow: 0 12px 25px rgba(197, 155, 39, 0.35);
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .image-card:hover img {
      transform: scale(1.06);
    }

    /* Download Overlay Button */
    .download-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-dark);
      border: 1px solid var(--gold);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 5;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .download-btn:hover {
      background: var(--gold);
      color: #FFFFFF;
      transform: scale(1.12);
    }

    .download-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      border: 2px solid var(--gold);
      box-shadow: 0 0 30px rgba(197, 155, 39, 0.4);
    }

    @media (max-width: 600px) {
      body { padding: 0.6rem; }
      header { padding: 0.8rem; margin-bottom: 0.6rem; }
      header h1 { font-size: 2.3rem; }
      header h1 span { font-size: 1.3rem; }
      nav.main-nav { gap: 0.4rem; padding: 0.4rem; }
      .nav-btn { padding: 0.45rem 0.75rem; font-size: 0.68rem; }
      .photo-gallery-card { padding: 1rem; }
      .image-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 0.8rem; }
      .download-btn { width: 32px; height: 32px; top: 6px; right: 6px; }
      .download-btn svg { width: 14px; height: 14px; }
    }
  </style>
</head>

    const downloadIconSvg = `
      <svg viewBox="0 0 24 24">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
    `;

    function downloadPhoto(event, photoUrl) {
      event.stopPropagation();
      window.open(photoUrl, '_blank');
    }

    function renderGallery(photosArray, targetGridId, countElementId) {
      const grid = document.getElementById(targetGridId);
      const countEl = document.getElementById(countElementId);
      grid.innerHTML = '';
      
      if (countEl) {
        countEl.innerText = `${photosArray.length} Photos`;
      }

      photosArray.forEach(path => {
        const card = document.createElement('div');
        card.className = 'image-card';
        card.onclick = () => openLightbox(path);

        const img = document.createElement('img');
        img.src = path;
        img.alt = 'Wedding Photo';
        img.loading = 'lazy';
        img.onerror = function() {
          this.src = 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=500&q=80';
        };

        const dlBtn = document.createElement('button');
        dlBtn.className = 'download-btn';
        dlBtn.title = 'Download Photo';
        dlBtn.innerHTML = downloadIconSvg;
        dlBtn.onclick = (e) => downloadPhoto(e, path);

        card.appendChild(img);
        card.appendChild(dlBtn);
        grid.appendChild(card);
      });
    }

    // Initialize Galleries
    renderGallery(haldiPhotos, 'haldiGrid', 'haldiCount');
    renderGallery(weddingPhotos, 'weddingGrid', 'weddingCount');

    // Tab Navigation Switcher
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function openLightbox(src) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>

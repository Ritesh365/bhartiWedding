<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nisha Weds Sumit - Celebration of Love</title>
  
  <!-- Google Fonts for Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --soft-white: rgba(255, 255, 255, 0.92);
      --text-dark: #2C221E;
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      /* Elegant Floral Wedding Background Theme */
      background: linear-gradient(rgba(20, 15, 12, 0.35), rgba(20, 15, 12, 0.35)), 
                  url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1.5rem 2rem;
      background: var(--soft-white);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 175, 55, 0.3);
      max-width: 800px;
      width: 100%;
    }

    .title-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      color: var(--text-dark);
      font-weight: 400;
      line-height: 1.2;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    header h1 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2.2rem;
      color: var(--gold);
      margin: 0 0.4rem;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 0.8rem;
    }

    .divider-line {
      height: 1px;
      width: 50px;
      background: var(--gold);
    }

    .divider-symbol {
      color: var(--gold);
      font-size: 0.9rem;
    }

    /* Main Content & iFrame Section */
    main {
      width: 100%;
      max-width: 1200px;
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .iframe-card {
      width: 100%;
      background: var(--soft-white);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 1.2rem;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
    }

    .iframe-container {
      width: 100%;
      height: 820px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      background: #FFFFFF;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #FFFFFF;
      font-size: 0.9rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      letter-spacing: 1px;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 600px) {
      header h1 {
        font-size: 2.8rem;
      }
      header h1 span {
        font-size: 1.8rem;
      }
      .iframe-container {
        height: 650px;
      }
      body {
        padding: 1rem 0.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <p class="title-sub">The Wedding Celebration Of</p>
    <h1>Nisha <span>weds</span> Sumit</h1>
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-symbol">&#10084;</span>
      <div class="divider-line"></div>
    </div>
  </header>

  <main>
    <section class="iframe-card">
      <div class="iframe-container">
        <iframe 
          allowfullscreen 
          id="fotoowl-iframe" 
          src="https://site.fotoowl.ai/rkstudi64/gallery/333143?embed=true&cover=true&pass_key=326641" 
          loading="lazy" 
          allow="camera"
          title="Nisha & Sumit Wedding Gallery">
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>Made with &hearts; &bull; Nisha &amp; Sumit</p>
  </footer>

</body>
</html>

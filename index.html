<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nisha Weds Sumit - Celebration of Love</title>
  
  <!-- Google Fonts for Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #D4AF37;
      --soft-white: rgba(255, 255, 255, 0.94);
      --text-dark: #2C221E;
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Prevents outer page double scrollbars */
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
    }

    body {
      /* Elegant Wedding Background Theme */
      background: linear-gradient(rgba(20, 15, 12, 0.4), rgba(20, 15, 12, 0.4)), 
                  url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 1.2rem;
      padding: 1rem 2rem;
      background: var(--soft-white);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 175, 55, 0.4);
      width: 100%;
      max-width: 900px;
      flex-shrink: 0; /* Ensures header doesn't shrink when iframe scales */
    }

    .title-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: var(--text-dark);
      font-weight: 400;
      line-height: 1.1;
    }

    header h1 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2rem;
      color: var(--gold);
      margin: 0 0.5rem;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 0.4rem;
    }

    .divider-line {
      height: 1px;
      width: 40px;
      background: var(--gold);
    }

    .divider-symbol {
      color: var(--gold);
      font-size: 0.85rem;
    }

    /* Full Page Expanded iFrame Container */
    main {
      width: 100%;
      flex: 1; /* Automatically expands to take all remaining vertical space */
      display: flex;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 600px) {
      body {
        padding: 0.8rem;
      }
      header {
        padding: 0.8rem 1rem;
        margin-bottom: 0.8rem;
      }
      header h1 {
        font-size: 2.6rem;
      }
      header h1 span {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Heading Updated to Nisha Weds Sumit -->
  <header>
    <p class="title-sub">The Wedding Celebration Of</p>
    <h1>Nisha <span>weds</span> Sumit</h1>
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-symbol">&#10084;</span>
      <div class="divider-line"></div>
    </div>
  </header>

  <!-- Expanded Full-Page iFrame Section -->
  <main>
    <div class="iframe-wrapper">
      <iframe 
        allowfullscreen 
        id="fotoowl-iframe" 
        src="https://site.fotoowl.ai/rkstudi64/gallery/333143?embed=true&cover=true&pass_key=326641" 
        loading="lazy" 
        allow="camera"
        title="Nisha & Sumit Wedding Gallery">
      </iframe>
    </div>
  </main>

</body>
</html>
